<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Luxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-wrapper {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            padding: 4rem 0;
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .cart-table th {
            text-align: left;
            padding: 1.5rem;
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-light);
        }

        .cart-table td {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cart-item-img {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-md);
            object-fit: cover;
        }

        .cart-summary {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            height: fit-content;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: var(--text-light);
        }

        .summary-total {
            border-top: 1px solid #eee;
            padding-top: 1rem;
            margin-top: 1rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .cart-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header id="header">
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-gem"></i> LUXE</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <a href="#" class="icon-btn search-btn"><i class="fa-solid fa-magnifying-glass"></i></a>
                <a href="cart.html" class="icon-btn"><i class="fa-solid fa-bag-shopping"></i> <span class="badge"
                        id="cart-count">0</span></a>
                <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="cart-wrapper">
            <!-- Cart Items -->
            <div class="cart-list">
                <h1 style="margin-bottom: 2rem;">Shopping Cart (3)</h1>
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Items will be injected by script.js -->
                    </tbody>
                </table>
            </div>

            <!-- Summary -->
            <div class="cart-summary">
                <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="summary-row">
                    <span>Tax</span>
                    <span>$10.00</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>
                <a href="checkout.html" class="btn btn-primary"
                    style="width: 100%; text-align: center; margin-top: 2rem;">Proceed to Checkout</a>
                <a href="products.html"
                    style="display:block; text-align:center; margin-top:1rem; font-size:0.9rem; color:var(--text-light); text-decoration:underline;">Continue
                    Shopping</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
